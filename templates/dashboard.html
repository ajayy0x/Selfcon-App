{% extends "base.html" %}
{% block title %}Dashboard | SelfCon{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 pt-10">
  <h1 class="text-3xl font-extrabold">Hello, {{ user }}</h1><p class="text-slate-600 mt-1">Your bookings, listings and saved homes in one place.</p>
  <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mt-6"></div>
  <div class="grid lg:grid-cols-2 gap-6 mt-6">
    <section class="bg-soft rounded-2xl p-6"><h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="trending-up" class="w-5 h-5 text-brand"></i>Projected earnings</h2><div id="chart" class="mt-4"></div></section>
    <section class="bg-soft rounded-2xl p-6"><h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="calendar" class="w-5 h-5 text-brand"></i>My bookings</h2><div id="bookings" class="mt-4 space-y-3"></div></section>
    <section class="bg-soft rounded-2xl p-6"><h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="home" class="w-5 h-5 text-brand"></i>My listings</h2><div id="mylist" class="mt-4 space-y-3"></div></section>
    <section class="bg-soft rounded-2xl p-6"><h2 class="font-bold text-lg flex items-center gap-2"><i data-lucide="heart" class="w-5 h-5 text-brand"></i>My favourites</h2><div id="favlist" class="mt-4 space-y-3"></div></section>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Sign in | SelfCon{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-4 pt-12">
  <div class="text-center"><img src="/static/logo.png" alt="SelfCon" class="h-28 w-28 mx-auto"><h1 class="text-2xl font-extrabold mt-3">Welcome to SelfCon</h1></div>
  <div class="mt-6 bg-white border border-slate-100 shadow-soft rounded-2xl p-6">
    <div class="flex bg-soft rounded-xl p-1 text-sm font-bold mb-5"><button type="button" data-tab="login" class="mode-tab flex-1 justify-center">Log in</button><button type="button" data-tab="signup" class="mode-tab flex-1 justify-center">Sign up</button></div>
    <a href="/auth/google{{ '?next=' + request.args.get('next') if request.args.get('next') }}" class="w-full border border-slate-200 rounded-xl py-3 font-semibold flex items-center justify-center gap-2 hover:bg-soft"><i data-lucide="globe" class="w-4 h-4"></i>Continue with Google</a>
    <p class="text-center text-xs text-slate-400 my-4">or use your email</p>
    {% if error %}<p class="bg-red-50 text-red-700 text-sm rounded-xl p-3 mb-4 flex gap-2"><i data-lucide="circle-alert" class="w-4 h-4 mt-0.5 shrink-0"></i>{{ error }}</p>{% endif %}
    <form method="post" class="space-y-4" id="auth-form" data-tab="{{ tab }}"><input type="hidden" name="action" id="action" value="{{ tab }}">
      <label class="lbl signup-only">Full name<input name="name" class="inp" placeholder="Ada Okafor"></label>
      <label class="lbl">Email<input name="email" type="email" required class="inp" placeholder="you@example.com"></label>
      <label class="lbl">Password<input name="password" type="password" minlength="6" required class="inp" placeholder="At least 6 characters"></label>
      <button class="btn-primary w-full justify-center !py-3.5" id="auth-submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
